apis:
- aid: hammerspace:anvil-management-api
  name: Hammerspace Anvil Management API
  description: 'The management REST API served by the Hammerspace Anvil metadata server
    at the base path /mgmt/v1.2/rest. It is the programmatic control plane behind the
    Hammerspace GUI and admin CLI, covering shares, files, objectives, storage volumes,
    object-storage volumes, volume groups, data portals, nodes, sites, snapshots, snapshot
    retentions, share replications, schedules, tasks, licenses, Active Directory and
    identity provider configuration, antivirus, backup, NTP, syslog and proxy settings.
    It is served by each customer deployment rather than from a Hammerspace-hosted
    public endpoint, so the host is the customer''s own Anvil. Hammerspace does not
    publish an OpenAPI description of it on a public URL; the operations recorded here
    were observed in Hammerspace''s own Apache-2.0 licensed open source clients (the
    Kubernetes CSI driver and the Ansible operations playbooks).'
  humanURL: https://hammerspace.com/resources/
  baseURL: https://{anvil-host}/mgmt/v1.2/rest
