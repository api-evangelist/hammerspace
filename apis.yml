aid: hammerspace
name: Hammerspace
description: 'Hammerspace, Inc. is a Redwood City, California software company behind
  the Hammerspace Global Data Platform (formerly the Global Data Environment), a parallel
  file system and software-defined data platform that unifies unstructured data across
  on-premises storage, edge sites, and AWS, Azure and Google Cloud into a single global
  namespace. Data is reached through standard protocols — NFS, pNFS v4.2 with Flex
  Files, SMB, S3, and CSI for Kubernetes — while placement, replication, tiering, snapshots
  and retention are driven by declarative objectives rather than by manual data movement.
  The platform is administered through a GUI, an admin CLI, the open source hstk Python
  toolkit, Ansible and Terraform automation, and the Anvil metadata server REST API
  at /mgmt/v1.2/rest. The 2026 AI Data Platform release adds Tier-0 NVMe pooling on
  GPU servers, Milvus vector search, and a Model Context Protocol (MCP) server that
  exposes enterprise data to AI agents and RAG pipelines.'
