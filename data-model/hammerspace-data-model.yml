metadata_model:
  description: >-
    Beyond the REST resources, Hammerspace's differentiating data model is the
    per-inode metadata plane exposed through hstk and Hammerscript: attributes
    (arbitrary name/value), keywords, labels, tags, Rekognition tags (added by
    image and video analysis), and objectives. Objectives are expressed as
    (objective, expression) pairs and are what drive automated placement.
  surface: cli/hammerspace-cli.yml
