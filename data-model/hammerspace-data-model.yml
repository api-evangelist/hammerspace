source: >-
  Derived from the collection paths exercised by Hammerspace's own Apache-2.0
  clients — github.com/hammer-space/ansible Operations playbooks and the
  csi-plugin Go client — plus the object vocabulary of the hstk CLI. No OpenAPI
  exists to derive $ref links from, so relationships are asserted only where a
  public client demonstrably navigates from one entity to another.
applies_to: apis.yml#hammerspace:anvil-management-api
base_path: /mgmt/v1.2/rest
confidence: medium
entities:
- name: share
  collection: /shares
  item: /shares/{id}
  operations_observed: [GET collection, GET item, POST, PUT, DELETE]
  description: >-
    An exported folder in the global namespace, the primary provisioning unit.
    Carries objectives at create time and is the unit the CSI driver maps to a
    Kubernetes PersistentVolume.
  evidence: [csi-plugin, ansible]
- name: file
  collection: /files
  lookup: /files?path={path}
  operations_observed: [GET]
  description: An individual inode in the namespace, addressed by path rather than
    by opaque id.
  evidence: [csi-plugin]
- name: objective
  collection: /objectives
  item: /objectives/{id}
  operations_observed: [GET collection, GET item]
  description: >-
    A declarative placement, tiering, protection or retention rule expressed as
    an (objective, expression) pair. Objectives are the control abstraction of
    the whole platform; they attach to shares and to individual files.
  evidence: [csi-plugin, ansible, hstk]
- name: task
  collection: /tasks
  item: /tasks/{id}
  operations_observed: [GET collection, GET item]
  description: >-
    An asynchronous unit of work returned alongside HTTP 202 by long-running
    mutations; polled to a terminal state (COMPLETED, FAILED, HALTED, CANCELLED,
    VALIDATION_FAILED, RESUMED).
  evidence: [csi-plugin]
