- id: csi-plugin
  name: Hammerspace CSI Volume Plugin
  url: https://github.com/hammer-space/csi-plugin/blob/main/CHANGELOG.md
  format: Keep a Changelog 1.0.0
  scheme: semver
  current: 1.3.0
  dated: false
  note: Entries are versioned and categorised (Added/Changed/Removed/Fixed/Security)
    but carry no release dates.
  entries:
  - version: 1.3.0
    breaking: true
    highlights:
    - Added the objectiveTarget StorageClass parameter (share | file | both) so
      file-backed provisioning skips the per-file objective set and the Anvil
      file-visibility poll.
    - Added OpenTelemetry tracing and Prometheus metrics across every controller
      and node RPC and every Anvil REST call (hs_csi_operation_*,
      hs_csi_anvil_requests_total).
    - Added minimum size gates for file-backed volumes and an fsfreeze of the
      source volume before snapshot.
    - Added Kubernetes 1.34/1.35/1.36 manifests and an importable Grafana
      dashboard under deploy/monitoring.
    - Removed ext3 as a supported file-backed filesystem; CreateVolume now
      rejects fsType=ext3 with InvalidArgument.
    - Changed task-completion polling to a fixed 2s/30s-then-4s cadence instead
      of exponential backoff.
    - Security — hardened example credential handling, added SECRETS.md covering
      a least-privilege Anvil service account, and scoped the secrets RBAC grant
      to get on a single named Secret.
  - version: 1.2.9
    breaking: true
    highlights:
    - Included share objectives in share create requests instead of follow-up
      objective-set calls.
    - Treated all known terminal task states consistently when polling.
    - Removed the driver-specific clientMountOptions StorageClass parameter in
      favour of Kubernetes mountOptions / CSI mountFlags.
    - Honoured the fqdn StorageClass parameter in Anvil-only deployments with no
      data portals.
  - version: 1.2.8
    breaking: false
    highlights:
    - Added OpenTelemetry tracing with W3C traceparent propagation on all REST
      calls to Hammerspace.
    - Added NFS root-share mounting with per-volume bind mounts.
    - Added the mountBackingShareName StorageClass parameter.
